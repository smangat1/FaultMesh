[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "faultmesh"
version = "0.1.0"
description = "Evidence-driven, offline-first neuro-symbolic bug discovery for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "FaultMesh contributors" }]
dependencies = [
  "hypothesis>=6.112,<7",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
faultmesh = "faultmesh.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/faultmesh"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "container: requires an available Docker daemon and may build an image",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".faultmesh"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["faultmesh"]

